name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5fe8a6&color_dots=#ebedf0,#d9d0ff,#bba9fb,#8b6cf0,#5b3fd0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5fe8a6&color_dots=#161b22,#2a2350,#4a3a9a,#8b6cf0,#a68bff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
