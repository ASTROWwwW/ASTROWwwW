<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="588" height="262" viewBox="0 0 588 262" role="img" aria-label="Agent Admin : Menu d'administration">
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
  <stop offset=".6" stop-color="#fff" stop-opacity=".025"/>
  <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#a68bff"/><stop offset="1" stop-color="#8b6cf0"/>
</linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>
text{font-family:'Figtree','Segoe UI','Helvetica Neue',Arial,sans-serif}
.sh{animation:sh 6s ease-in-out infinite}
@keyframes sh{0%,70%{transform:translateX(-200px)}100%{transform:translateX(788px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><clipPath id="c"><rect width="588" height="262" rx="22"/></clipPath></defs>
<rect width="588" height="262" rx="22" fill="#0a0912"/>
<rect width="588" height="262" rx="22" fill="url(#glass)"/>
<g clip-path="url(#c)">
  <circle cx="548" cy="-30" r="130" fill="#5fe8a6" opacity=".16" filter="url(#b)"/>
  <rect class="sh" x="0" y="0" width="90" height="2" fill="#5fe8a6" opacity=".9"/>
</g>
<rect x=".5" y=".5" width="587" height="261" rx="22" fill="none" stroke="#fff" stroke-opacity=".13"/>
<text x="32" y="46" font-size="14.5" font-weight="600" fill="#5fe8a6">Menu d'administration</text>
<text x="32" y="90" font-size="32" font-weight="800" fill="#fff" letter-spacing="-.5">Agent Admin</text>
<g>
  <rect x="428" y="26" width="128" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
  <circle cx="446" cy="41" r="4.5" fill="#5fe8a6"/>
  <text x="459" y="46" font-size="13" font-weight="600" fill="#fff" fill-opacity=".85">En production</text>
</g>
<text x="32" y="128" font-size="15.5" font-weight="500" fill="#fff" fill-opacity=".72">Joueurs, véhicules, sanctions et historique dans un</text>
<text x="32" y="151" font-size="15.5" font-weight="500" fill="#fff" fill-opacity=".72">seul menu, sans jamais quitter la partie.</text>
<rect x="32" y="206" width="45" height="26" rx="13" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
<text x="54.5" y="224" font-size="13" font-weight="600" fill="#fff" fill-opacity=".8" text-anchor="middle">Lua</text>
<rect x="85" y="206" width="98" height="26" rx="13" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
<text x="134" y="224" font-size="13" font-weight="600" fill="#fff" fill-opacity=".8" text-anchor="middle">JavaScript</text>
<rect x="191" y="206" width="45" height="26" rx="13" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
<text x="213.5" y="224" font-size="13" font-weight="600" fill="#fff" fill-opacity=".8" text-anchor="middle">SQL</text>

</svg>
