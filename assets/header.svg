<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Astrow, software developer">
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
  <stop offset=".6" stop-color="#fff" stop-opacity=".025"/>
  <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
</linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#a68bff"/><stop offset="1" stop-color="#8b6cf0"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<clipPath id="clip"><rect width="1200" height="340" rx="26"/></clipPath>
</defs>
<style>
text{font-family:'Figtree','Segoe UI','Helvetica Neue',Arial,sans-serif}

.o1{animation:d1 15s ease-in-out infinite alternate}
.o2{animation:d2 18s ease-in-out infinite alternate}
.o3{animation:d3 13s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,40px)}}
@keyframes d2{to{transform:translate(-110px,-50px)}}
@keyframes d3{to{transform:translate(-60px,60px)}}
.pulse{animation:pl 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.bob{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-9px)}}
.f1,.f2{transform-box:fill-box;transform-origin:left center}
.f1{animation:f1 5s ease-in-out infinite alternate}
.f2{animation:f2 7s ease-in-out infinite alternate}
@keyframes f1{from{transform:scaleX(.25)}to{transform:scaleX(.92)}}
@keyframes f2{from{transform:scaleX(.8)}to{transform:scaleX(.35)}}
.kn{animation:kn 4s ease-in-out infinite alternate}
@keyframes kn{0%,40%{transform:translateX(0)}60%,100%{transform:translateX(20px)}}
.tr{animation:tr 4s ease-in-out infinite alternate}
@keyframes tr{0%,40%{fill:rgba(255,255,255,.18)}60%,100%{fill:#8b6cf0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g clip-path="url(#clip)">
  <rect width="1200" height="340" fill="#0a0912"/>
  <g filter="url(#blur)">
    <g class="o1"><circle cx="250" cy="110" r="190" fill="#8b6cf0" opacity=".55"/></g>
    <g class="o2"><circle cx="1010" cy="300" r="170" fill="#5fe8a6" opacity=".26"/></g>
    <g class="o3"><circle cx="640" cy="20" r="150" fill="#a68bff" opacity=".32"/></g>
  </g>
  <rect width="1200" height="340" fill="#0a0912" opacity=".18"/>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="26" fill="none" stroke="#fff" stroke-opacity=".12"/>

<g>
  <rect x="64" y="56" width="44" height="44" rx="13" fill="url(#brand)"/>
  <text x="86" y="87" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">A</text>
</g>
<text x="62" y="212" font-size="104" font-weight="800" fill="#fff" letter-spacing="-3">Astrow</text>
<text x="64" y="258" font-size="30" font-weight="700" fill="#a68bff">Software Developer</text>
<text x="64" y="296" font-size="18" font-weight="500" fill="#fff" fill-opacity=".66">Open source, infrastructure and business software.</text>

<g>
  <rect x="800" y="40" width="336" height="42" rx="21" fill="url(#glass)" stroke="#fff" stroke-opacity=".16"/>
  <circle class="pulse" cx="826" cy="61" r="5" fill="#5fe8a6"/>
  <circle cx="826" cy="61" r="5" fill="#5fe8a6"/>
  <text x="846" y="67" font-size="16" font-weight="600" fill="#fff" fill-opacity=".9">Open to new projects</text>
</g>

<g class="bob">
  <rect x="800" y="112" width="336" height="190" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="824" cy="136" r="5" fill="#fff" fill-opacity=".28"/>
  <circle cx="842" cy="136" r="5" fill="#fff" fill-opacity=".18"/>
  <circle cx="860" cy="136" r="5" fill="#fff" fill-opacity=".12"/>
  <rect x="1000" y="131" width="112" height="10" rx="5" fill="#fff" fill-opacity=".14"/>

  <rect x="824" y="166" width="96" height="9" rx="4.5" fill="#fff" fill-opacity=".42"/>
  <rect x="824" y="184" width="288" height="9" rx="4.5" fill="#fff" fill-opacity=".10"/>
  <rect class="f1" x="824" y="184" width="288" height="9" rx="4.5" fill="#8b6cf0"/>

  <rect x="824" y="212" width="70" height="9" rx="4.5" fill="#fff" fill-opacity=".42"/>
  <rect x="824" y="230" width="288" height="9" rx="4.5" fill="#fff" fill-opacity=".10"/>
  <rect class="f2" x="824" y="230" width="288" height="9" rx="4.5" fill="#5fe8a6"/>

  <rect x="824" y="266" width="110" height="9" rx="4.5" fill="#fff" fill-opacity=".42"/>
  <rect class="tr" x="1068" y="258" width="44" height="24" rx="12" fill="rgba(255,255,255,.18)"/>
  <circle class="kn" cx="1080" cy="270" r="9" fill="#fff"/>
</g>

</svg>
